<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchboard Softphone</title>
<style>
  :root { --ivory: #f3ecdc; --ink: #3b3226; --brass: #b08d57; --panel: #e6dcc6; --line: #cbbd9f; --live: #4f7a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start;
    background: #2d2822; color: var(--ink); font: 16px/1.4 Georgia, 'Times New Roman', serif; padding: 24px 16px; }
  .phone { width: 100%; max-width: 360px; background: var(--ivory); border-radius: 28px; padding: 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5), inset 0 -6px 0 var(--line); }
  h1 { margin: 0 0 12px; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; text-align: center; color: var(--brass); }
  #status { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: center;
    font-size: 18px; min-height: 52px; }
  body.offhook #status { border-color: var(--live); }
  #hook { display: block; width: 100%; margin: 14px 0; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
    background: var(--ink); color: var(--ivory); font: inherit; font-size: 18px; }
  body.offhook #hook { background: #8a3b2e; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key { aspect-ratio: 1.3; border-radius: 50%; border: 2px solid var(--brass); background: var(--panel); color: var(--ink);
    font: inherit; font-size: 22px; cursor: pointer; }
  .key:active { background: var(--brass); color: var(--ivory); }
  body:not(.offhook) .key { opacity: .45; }
  .small { margin-top: 14px; font: 12px/1.5 Menlo, monospace; color: #6c604e; }
  #log { margin-top: 8px; max-height: 160px; overflow-y: auto; font: 12px/1.5 Menlo, monospace; color: #6c604e; }
  .hint { font-size: 13px; color: #6c604e; text-align: center; margin-top: 10px; }
</style>
</head>
<body>
<div class="phone">
  <h1>Switchboard</h1>
  <div id="status">Connecting…</div>
  <button id="hook">Lift handset</button>
  <div class="keys">
    <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button>
    <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button>
    <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button>
    <button class="key" data-key="*">*</button><button class="key" data-key="0">0</button><button class="key" data-key="#">#</button>
  </div>
  <div class="hint">0 operator · 101 echo test · space bar lifts and hangs up</div>
  <div class="small"><div id="frames"></div><div id="buffer"></div></div>
  <div id="log"></div>
</div>
<script src="softphone.js"></script>
</body>
</html>
