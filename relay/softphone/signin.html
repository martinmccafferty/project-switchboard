<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Rotary Phone · {{title}}</title>
<style>
  :root { --ivory: #f3ecdc; --ink: #3b3226; --brass: #b08d57; }
  body { margin: 0; min-height: 100vh; background: #2d2822; color: var(--ink); font: 16px/1.45 Georgia, 'Times New Roman', serif;
    display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  main { width: 100%; max-width: 380px; background: var(--ivory); border-radius: 18px; padding: 24px; text-align: center;
    box-shadow: 0 8px 28px rgba(0,0,0,.4); }
  h1 { margin: 0 0 8px; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; color: var(--brass); }
  h2 { margin: 0 0 12px; font-size: 16px; font-weight: normal; }
  a.google { display: inline-block; margin-top: 8px; padding: 10px 18px; border-radius: 8px; background: var(--ink);
    color: var(--ivory); text-decoration: none; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>AI Rotary Phone</h1>
  <h2>{{title}}</h2>
  {{body}}
</main>
</body>
</html>
